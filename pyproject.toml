[project]
name = "athena"
version = "0.1.0"
description = "Local-first personal AI assistant (task, schedule, memory, project manager)"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.32.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"